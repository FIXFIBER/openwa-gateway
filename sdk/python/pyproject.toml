[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmyndharis-idawhats"
version = "0.1.0"
description = "Official Python SDK for IdaWhats WhatsApp API Gateway"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "IdaWhats Contributors" }
]
keywords = ["whatsapp", "api", "sdk", "idawhats", "gateway"]

dependencies = [
    "httpx>=0.25.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/rmyndharis/IdaWhats"
Repository = "https://github.com/rmyndharis/IdaWhats"

[tool.setuptools.packages.find]
include = ["idawhats*"]

# Ship type information (PEP 561) so consumers get the bundled type hints.
[tool.setuptools.package-data]
idawhats = ["py.typed"]
"idawhats.resources" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
